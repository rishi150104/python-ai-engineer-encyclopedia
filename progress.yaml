# Per-entry status. Content and verification are separate axes. Only concept nodes get entries.
# Allowed transitions (enforced by scripts/validate.py against each entry's `history`):
#   content:      NOT_STARTED -> RESEARCHED -> DRAFTED -> COMPLETE
#                 back-steps allowed: DRAFTED -> RESEARCHED, COMPLETE -> DRAFTED
#   verification: NOT_CHECKED -> IN_PROGRESS -> VERIFIED | NEEDS_REVISION | CONFLICTING_EVIDENCE
#                 NEEDS_REVISION | CONFLICTING_EVIDENCE | VERIFIED -> IN_PROGRESS (re-check)
#                 any state -> NOT_CHECKED only when content moved backward (content change invalidates checks)
# Cross-axis rules:
#   verification IN_PROGRESS/VERIFIED/... requires content >= DRAFTED
#   VERIFIED requires content COMPLETE and a passing verification/<ID>.yaml (see validate.py)
#   content moving backward forces verification NOT_CHECKED in the same history step
