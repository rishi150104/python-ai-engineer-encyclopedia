    - Return a deep copy of obj.
  version_note: "Interface wording changed in 3.13: the parameter is documented as `obj` instead of `x` (copy.copy(obj), copy.deepcopy(obj[, memo])); 3.13 also adds copy.replace(), which this entry does not cover. Definitions of shallow and deep copy are unchanged."
