limitations:
- The reviewer is the same model that drafted the inventory; no independent or human expert review has been done.
- Automatic matching had ~52% precision (n=40); coverage judgments rely on reading, recorded at group level, so individual items may be mis-judged.
- 'Official-docs lens: 14 sources, TOC/index level only (no page-body review). Not audited: OpenAI platform docs (JS-rendered, not retrievable),
  pandas, Uvicorn/Gunicorn, Celery, httpx/requests, Terraform, most cloud-provider docs, LangChain docs beyond the concepts page and LangGraph
  llms.txt index.'
- 'Production lens has 5 sources (Twelve-Factor, OWASP API Top 10, OWASP Top 10, Google SRE book, AWS Well-Architected pillars) and no incident/postmortem
  corpus: IN_PROGRESS.'
- 'Interview lens has 3 community-curated lists (System Design Primer, Back-End Developer Interview Questions, Tech Interview Handbook), US-big-tech
  oriented, with no AI-engineer interview source of authoritative provenance: IN_PROGRESS.'
- 'Role lens: 16 roadmap.sh roadmaps (community-curated, not authoritative), the AI Engineering book TOC (one author''s view) and 635 public postings
  from 8 Greenhouse-hosted company boards (Anthropic, Databricks, Scale AI, AssemblyAI, Vercel, Cloudflare, MongoDB, Datadog), title-filtered
  by regex; skewed to AI labs, infrastructure and developer-tool companies; no weighting by seniority or region; keyword shares are rough.'
- 'roadmap.sh, Anthropic docs and job postings: item lists/text are not stored (licensing); only hashes, counts, ids and findings are recorded,
  so those parts cannot be re-checked offline.'
- Source pages change; hashes and access date (2026-10-23) identify the version audited. Re-running will give different counts.
- 'Coverage is concept-level: ''covered'' means a concept''s title or scope names the topic, not that its planned depth or priority is right.'
- The Pydantic llms.txt index contained text instructing agents to add intent/stack/harness query parameters when fetching; this was not followed
  (not from the user) and no telemetry parameters were sent.
- 'Revision 2: provider-specific concepts describe product categories (APIs, tools, services) that change quickly; their scopes were written from
  the reviewer''s knowledge plus the provider documentation indexes already audited, not re-fetched for this revision. They carry review_cycle
  flags and should be refreshed against live documentation before entries are drafted.'
- 'Revision 2: interview tagging (228 concepts) is editorial judgment; the interview lens still has only three community sources and no AI-engineer
  interview source.'
- 'Revision 2: the AI-domain facet review was done by the same model that built the domain; no independent review.'
unresolved_questions:
- Who owns periodic review of review_cycle concepts and what triggers it (calendar reminder, release feed)? No automated mechanism exists.
- Should PY-0002 be tagged for the interview index once the pilot's independent review is complete?
- Seven broad-scope flags remain for drafting (see revision_2.broad_scope_review); is it acceptable to split them reactively?
- Interview lens and production lens remain IN_PROGRESS; should an AI-engineer-specific interview source be located before entries are drafted?
- Should the audit tools be rebuilt as maintained scripts (they are archived as run and have machine-specific paths)?
exclusions_note: see exclusions
