- category: non-Python language stacks and frameworks (Java, Scala, Go, Rust, C++, PHP, Ruby; Node.js)
  rationale: 'SCOPE: Python backend. In sampled job bullets Java/Scala/Go/Rust/C++ appear in 268 of 3096 (8.7%): flagged as a decision for the
    user. Revision 2: awareness-level concepts for Go, Rust, Java and C++ were added (topic cs.langs); full language tracks, PHP, Ruby and Node.js
    remain excluded'
  seen_in: R-RM-backend; R-RM-devops; R-JOBS-*
- category: frontend and web UI engineering (HTML/CSS/JS, SPAs, SSR/CSR, React, browsers)
  rationale: 'outside backend-to-AI scope; JS/TS/React appear in 121 of 3096 job bullets (3.9%), mostly full-stack roles. Revision 2: a scoped
    demo/internal-tool UI topic was added (be.ui); SPA frameworks, design systems, state management, bundlers, accessibility depth and mobile
    remain excluded'
  seen_in: R-RM-backend; R-RM-qa; I-BACKEND-QA; R-JOBS-*
- category: CPython installation, building and platform-specific usage (Windows, macOS, Unix, WebAssembly), C API and extension internals
