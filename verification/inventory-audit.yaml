# Inventory audit record (human-authored; edited by scripted revisions recorded under revision_2). Four lenses; a lens is DONE only with recorded sources.
# coverage_claim: NONE | PARTIAL | AUDITED_WITH_LIMITATIONS. 'Complete' is not allowed.
# Structure checks (duplicates, breadth, prerequisites) are in verification/coverage-report.md (generated by scripts/audit_inventory.py).
schema_version: 2
coverage_claim: PARTIAL
coverage_claim_reason: Four lenses were examined against 47 sources, but two lenses are thin (production, interview), the reviewer is the same
  model that built the inventory, and automatic matching was measured at ~52% precision, so no claim stronger than PARTIAL is made.
date: 2026-10-23 (revision 2)
inventory_size:
  concepts: 787
  topics_and_subtopics: 91
  domains: 11
method:
- 1. Build inventory from CLAUDE.md section 4 plus a first internal review pass (duplicates, fragmentation, missing foundations).
- 2. Fetch source tables of contents / indexes / role definitions / public job postings (raw HTTP, 2026-10-23); extract titles, headings, roadmap
  nodes, requirement bullets.
- 3. Token-weighted auto-matching of source items to concepts, used only to generate candidates (measured precision below).
- 4. The reviewer read every item list (matched and unmatched) and judged coverage against the inventory by reading; dispositions are recorded
  at group level, with per-item records only for gaps.
- 5. Gaps were closed by adding concepts, extending scopes, merging duplicates or re-prioritizing; validator and structure audit re-run after
  each change.
- 6. Matcher quality and residual gaps were sampled with a fixed seed (7).
matcher_quality:
  seed: 7
  matched_sample_n: 40
  matched_sample_right_concept: 21
  precision_estimate: 0.52
  interpretation: About half of auto-matches pointed to a plausible covering concept; spurious matches came from generic single words (Databases,
    Policies, Python API). Auto-matches are therefore NOT counted as coverage evidence.
  unmatched_sample_n: 40
  unmatched_sample_true_gaps_after_additions: 0
  unmatched_sample_note: 'All 40 were covered by an existing concept under different wording, or fell into a recorded exclusion category (rule
    of three: the true-gap rate is below ~7.5% at 95% confidence for the sampled population).'
